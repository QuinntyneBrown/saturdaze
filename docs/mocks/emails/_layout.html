<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{subject}} — Saturdaze</title>
</head>
<!--
  The email layout every message Saturdaze sends uses (L2-162). Emails cannot
  load the design system, so the light-theme token values are inlined:
    colorNeutralBackground2 #faf7f2  page    colorNeutralBackground1 #ffffff  card
    colorNeutralForeground1 #1f2937  ink     colorNeutralForeground2 #5b6270  soft ink
    colorBrandBackground    #bf5130  button  colorNeutralForegroundOnBrand #ffffff
    colorBrandForeground1   #e07856  mark    colorBrandBackground2   #fbe7de  note
    colorNeutralStroke1 rgba(31,41,55,.16)   borderRadiusLarge 16px · pill 999px
    fontFamilyBase Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif
  Single column, 600px, tables, inline styles only: no stylesheet, script, web font or image.
  This file is the template; the specimens beside it fill the slots.
-->
<body style="margin:0;padding:0;background:#faf7f2;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#faf7f2;">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:600px;max-width:100%;">
      <tr><td style="padding:0 8px 20px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0"><tr>
          <td style="width:28px;height:28px;border-radius:9px;background:#e07856;"></td>
          <td style="padding-left:10px;font-size:17px;font-weight:700;color:#1f2937;">Saturdaze</td>
        </tr></table>
      </td></tr>
      <tr><td style="background:#ffffff;border:1px solid rgba(31,41,55,0.16);border-radius:16px;padding:32px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1f2937;">
        {{content}}
      </td></tr>
      <tr><td style="padding:20px 8px 0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:12px;line-height:1.5;color:#5b6270;">
        {{footer}}
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
