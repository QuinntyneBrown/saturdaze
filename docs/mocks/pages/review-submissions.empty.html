<!doctype html>
<html lang="en">
<head>
<!-- @shell:head -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review submissions — Saturdaze</title>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/app.css">
<!-- @/shell:head -->
</head>
<body data-page="review-submissions" data-shell="app">
<!-- @shell:topbar -->
<header class="topbar">
  <div class="container topbar__inner">
    <a class="topbar__brand" href="./weekend.html"><span class="brand-mark" aria-hidden="true"></span>Saturdaze</a>
    <nav class="topbar__nav" aria-label="Primary">
      <a class="topbar__link" data-nav="weekend" href="./weekend.html">Weekend</a>
      <a class="topbar__link" data-nav="ideas" href="./ideas.html">Ideas</a>
      <a class="topbar__link" data-nav="past" href="./past.html">Past</a>
      <a class="topbar__link" data-nav="family" href="./family.html" aria-current="page">Family</a>
    </nav>
    <div class="topbar__actions">
      <a class="avatar avatar--q avatar--btn" href="./dialogs.html#dialog-account" aria-label="Account menu">Q</a>
    </div>
  </div>
</header>
<!-- @/shell:topbar -->
<main class="app-main container container--stack" id="main">
  <header class="page-header">
    <div class="page-header__text">
      <a class="page-header__eyebrow hide-lt-720" href="./family.html"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-arrow_left"/></svg>Family</a>
      <div class="titlerow">
        <a class="btn btn--ghost btn--icon hide-gte-720" href="./family.html" aria-label="Back to Family"><svg class="icon" aria-hidden="true"><use href="#i-arrow_left"/></svg></a>
        <h1 class="page-header__title">Review submissions</h1>
      </div>
      <p class="page-header__subtitle">Nothing waiting. New suggestions show up here as families send them.</p>
    </div>
  </header>

  <section class="empty" aria-labelledby="empty-title">
    <span class="disc disc--xl disc--accent" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg></span>
    <h2 class="empty__title" id="empty-title">Queue is clear</h2>
    <p class="empty__body">Approved events are already live on Ideas. Rejected ones are gone.</p>
    <div class="empty__cta">
      <a class="btn btn--quiet" href="./family.html"><svg class="icon" aria-hidden="true"><use href="#i-arrow_left"/></svg>Back to Family</a>
    </div>
  </section>
</main>
<!-- @shell:bottomnav -->
<nav class="bottom-nav" aria-label="Primary">
  <a class="bottom-nav__item" data-nav="weekend" href="./weekend.html"><span class="bottom-nav__icon"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg></span>Weekend</a>
  <a class="bottom-nav__item" data-nav="ideas" href="./ideas.html"><span class="bottom-nav__icon"><svg class="icon" aria-hidden="true"><use href="#i-sparkle"/></svg></span>Ideas</a>
  <a class="bottom-nav__item" data-nav="past" href="./past.html"><span class="bottom-nav__icon"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg></span>Past</a>
  <a class="bottom-nav__item" data-nav="family" href="./family.html" aria-current="page"><span class="bottom-nav__icon"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg></span>Family</a>
</nav>
<!-- @/shell:bottomnav -->
<script src="../app.js"></script>
</body>
</html>
