<!doctype html>
<html lang="en">
<head>
<!-- @shell:head -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shell — Saturdaze</title>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/app.css">
<!-- @/shell:head -->
</head>
<body data-page="_shell" data-shell="app">
<!-- @shell:topbar -->
<header class="topbar">
  <div class="container topbar__inner">
    <a class="topbar__brand" href="./weekend.html"><span class="brand-mark" aria-hidden="true"></span>Saturdaze</a>
    <nav class="topbar__nav" aria-label="Primary">
      <a class="topbar__link" data-nav="weekend" href="./weekend.html">Weekend</a>
      <a class="topbar__link" data-nav="ideas" href="./ideas.html">Ideas</a>
      <a class="topbar__link" data-nav="past" href="./past.html">Past</a>
      <a class="topbar__link" data-nav="family" href="./family.html">Family</a>
    </nav>
    <div class="topbar__actions">
      <a class="avatar avatar--q avatar--btn" href="./dialogs.html#dialog-account" aria-label="Account menu">Q</a>
    </div>
  </div>
</header>
<!-- @/shell:topbar -->
<main class="app-main container" id="main">
  <header class="page-header">
    <div class="page-header__text">
      <h1 class="page-header__title">Shell</h1>
      <p class="page-header__subtitle">The canonical skeleton every page copies. Edit the title, the two body data attributes, and which nav link is current.</p>
    </div>
  </header>
  <div class="shell-demo">
    <button class="btn btn--primary" type="button"><svg class="icon" aria-hidden="true"><use href="#i-sparkle"/></svg>Primary</button>
    <button class="btn btn--quiet" type="button">Quiet</button>
    <button class="btn btn--ghost" type="button">Ghost</button>
    <button class="btn btn--danger" type="button">Danger</button>
    <button class="btn btn--quiet btn--icon" type="button" aria-label="More options"><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg></button>
    <span class="chip chip--accent"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>Locked</span>
    <span class="chip chip--sky"><svg class="icon" aria-hidden="true"><use href="#i-car"/></svg>45 min drive</span>
    <span class="chip chip--primary">Day highlight</span>
    <span class="chip chip--sun">Pending review</span>
    <span class="chip chip--leaf">Outdoor</span>
    <span class="chip chip--indoor">Indoor</span>
    <span class="chip chip--warn">Skip</span>
    <span class="disc disc--accent"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg></span>
    <span class="avatar avatar--s">S</span>
    <span class="avatar avatar--e">E</span>
    <span class="avatar avatar--m">M</span>
  </div>
</main>
<!-- @shell:bottomnav -->
<nav class="bottom-nav" aria-label="Primary">
  <a class="bottom-nav__item" data-nav="weekend" href="./weekend.html"><span class="bottom-nav__icon"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg></span>Weekend</a>
  <a class="bottom-nav__item" data-nav="ideas" href="./ideas.html"><span class="bottom-nav__icon"><svg class="icon" aria-hidden="true"><use href="#i-sparkle"/></svg></span>Ideas</a>
  <a class="bottom-nav__item" data-nav="past" href="./past.html"><span class="bottom-nav__icon"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg></span>Past</a>
  <a class="bottom-nav__item" data-nav="family" href="./family.html"><span class="bottom-nav__icon"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg></span>Family</a>
</nav>
<!-- @/shell:bottomnav -->
<script src="../app.js"></script>
</body>
</html>
