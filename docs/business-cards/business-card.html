<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saturdaze business card</title>
<!--
  Standard North American card: 3.5 x 2 in trim, 0.125 in bleed on every side
  (3.75 x 2.25 in). CSS px at 96/in: 360 x 216 with bleed, trim inset 12px,
  safe area a further 12px in. Render at deviceScaleFactor 3.125 for 300 DPI.
  ?side=front | ?side=back | ?guides=1 shows trim and safe lines.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF7F2;
    --ink: #1F2937;
    --ink-soft: #4B5563;
    --coral: #E07856;
    --terracotta: #A04B2C;
    }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #ffffff; }
  body { font-family: "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }

  .card { position: relative; width: 360px; height: 216px; overflow: hidden; }
  .card + .card { margin-top: 24px; }

  /* The website's .brand-mark (components/src/lib/top-bar/top-bar.scss), radius kept at 8/26 of the side */
  .mark {
    flex: none; width: 22px; height: 22px; border-radius: 6.8px;
    background:
      radial-gradient(120% 120% at 20% 0%, #FBE7DE 0%, transparent 60%),
      radial-gradient(120% 120% at 100% 100%, #FBEBC4 0%, transparent 60%),
      var(--coral);
    box-shadow: inset 0 0 0 1px rgba(31, 41, 55, 0.06);
  }

  /* Front: cream stock, identity first */
  .front { background: var(--cream); color: var(--ink); }
  .front__band { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: var(--coral); }
  .front__brand { position: absolute; top: 32px; left: 32px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; letter-spacing: -0.02em; }
  .front__who { position: absolute; left: 32px; bottom: 48px; }
  .front__name { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.1; }
  .front__role { margin: 6px 0 0; font-size: 10.5px; font-weight: 500; line-height: 1.45; color: var(--ink-soft); }
  .front__url { position: absolute; right: 32px; bottom: 48px; font-size: 10.5px; font-weight: 600; color: var(--terracotta); }

  /* Back: terracotta flood, wordmark centred */
  .back { background: var(--terracotta); color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .back__lockup { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
  .back .mark { width: 30px; height: 30px; border-radius: 9.2px; }
  .back__tag { font-size: 11px; font-weight: 500; color: #FBE7DE; letter-spacing: 0.01em; }
  .back__url { position: absolute; bottom: 30px; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #FBE7DE; }

  /* Optional trim (solid) and safe (dashed) guides */
  .guides .card::before, .guides .card::after { content: ""; position: absolute; pointer-events: none; z-index: 9; }
  .guides .card::before { inset: 12px; outline: 0.5px solid #00A3FF; }
  .guides .card::after { inset: 24px; outline: 0.5px dashed #FF2D9B; }
</style>
</head>
<body>
  <section class="card front" aria-label="Front">
    <div class="front__brand"><span class="mark" aria-hidden="true"></span>Saturdaze</div>
    <div class="front__who">
      <p class="front__name">Quinntyne Brown</p>
      <p class="front__role">CEO and Founder<br>Principal Product Engineer</p>
    </div>
    <div class="front__url">saturdaze.ca</div>
    <div class="front__band" aria-hidden="true"></div>
  </section>

  <section class="card back" aria-label="Back">
    <div class="back__lockup"><span class="mark" aria-hidden="true"></span>Saturdaze</div>
    <div class="back__tag">Family weekends, planned.</div>
    <div class="back__url">saturdaze.ca</div>
  </section>

<script>
  const q = new URLSearchParams(location.search);
  const side = q.get('side');
  if (side) document.querySelectorAll('.card').forEach(c => { if (!c.classList.contains(side)) c.remove(); else c.style.marginTop = '0'; });
  if (q.get('guides')) document.body.classList.add('guides');
</script>
</body>
</html>
