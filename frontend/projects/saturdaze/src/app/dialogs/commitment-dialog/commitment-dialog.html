<sd-dialog [title]="title" subtitle="Locked into every weekend." wide>
  <form class="form" (submit)="submit($event)">
    @if (saveFailed()) {
      <sd-banner tone="warn" role="alert" icon="alert">{{ saveFailed() }}</sd-banner>
    }
    <sd-text-input
      label="Name"
      name="commitmentTitle"
      required
      autocomplete="off"
      placeholder="Piano lesson"
      [ngModel]="name()"
      (ngModelChange)="name.set($event); error.set('')"
    />
    <sd-seg-radio
      label="Day"
      name="day"
      [options]="days"
      [ngModel]="day()"
      (ngModelChange)="day.set($event); error.set('')"
    />
    <div class="row-2">
      <sd-text-input
        label="Start"
        name="startTime"
        type="time"
        [ngModel]="startTime()"
        (ngModelChange)="startTime.set($event); error.set('')"
      />
      <sd-text-input
        label="End"
        name="endTime"
        type="time"
        [error]="error()"
        [ngModel]="endTime()"
        (ngModelChange)="endTime.set($event); error.set('')"
      />
    </div>
    @if (members.length) {
      <fieldset class="field">
        <legend class="field__label">Who goes</legend>
        <div class="cluster">
          @for (m of members; track m.id) {
            <sd-checkbox
              [name]="'goes-' + m.id"
              [ngModel]="goes(m.id)"
              (ngModelChange)="setGoes(m.id, $event)"
              >{{ m.name }}</sd-checkbox
            >
          }
        </div>
        <p class="field__hint">
          None ticked means everyone. Different people may overlap when an adult can take each.
        </p>
      </fieldset>
    }
    <sd-text-input
      label="Where"
      name="where"
      autocomplete="street-address"
      placeholder="Address, so the plan drives you there"
      hint="Optional"
      [error]="whereError()"
      [ngModel]="where()"
      (ngModelChange)="where.set($event); whereError.set('')"
    />
    <button type="submit" hidden></button>
  </form>

  @if (isEdit) {
    <sd-button slot="actions-left" variant="quiet" warnText type="button" (click)="remove()">
      <sd-icon name="trash" />
      Remove
    </sd-button>
  }
  <sd-button slot="actions" variant="quiet" type="button" (click)="cancel()">Cancel</sd-button>
  <sd-button
    slot="actions"
    variant="primary"
    type="button"
    [disabled]="!canSubmit()"
    (click)="submit()"
  >
    {{ submitLabel }}
  </sd-button>
</sd-dialog>
