<sd-dialog [title]="title" subtitle="Locked into every weekend." wide>
  <form class="form" (submit)="submit($event)">
    <sd-text-input
      label="Name"
      name="commitmentTitle"
      required
      autocomplete="off"
      placeholder="Piano lesson"
      [ngModel]="name()"
      (ngModelChange)="name.set($event); error.set('')"
    />
    <sd-seg-radio label="Day" [options]="days" [ngModel]="day()" (ngModelChange)="day.set($event); error.set('')" />
    <div class="row-2">
      <sd-text-input
        label="Start"
        name="startTime"
        type="time"
        [ngModel]="startTime()"
        (ngModelChange)="startTime.set($event); error.set('')"
      />
      <sd-text-input
        label="End"
        name="endTime"
        type="time"
        [error]="error()"
        [ngModel]="endTime()"
        (ngModelChange)="endTime.set($event); error.set('')"
      />
    </div>
    <button type="submit" hidden></button>
  </form>

  @if (isEdit) {
    <sd-button slot="actions-left" variant="quiet" warnText type="button" (click)="remove()">
      <sd-icon name="trash" />
      Remove
    </sd-button>
  }
  <sd-button slot="actions" variant="quiet" type="button" (click)="cancel()">Cancel</sd-button>
  <sd-button slot="actions" variant="primary" type="button" [disabled]="!canSubmit()" (click)="submit()">
    {{ submitLabel }}
  </sd-button>
</sd-dialog>
