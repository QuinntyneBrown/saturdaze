<sd-dialog title="How was it?" [subtitle]="data.eyebrow">
  <sd-stars size="lg" editable [rating]="rating()" (ratingChange)="rating.set($event)" />
  <p class="sd-text-sm sd-text-soft">{{ caption() }}</p>
  <sd-button slot="actions" variant="quiet" type="button" (click)="cancel()">Cancel</sd-button>
  <sd-button slot="actions" variant="primary" type="button" (click)="save()">Save</sd-button>
</sd-dialog>
