<sd-dialog title="Share this weekend" subtitle="Anyone with the link can view it. Nobody can edit.">
  @if (error()) {
    <sd-banner tone="warn" role="alert" icon="alert">{{ error() }}</sd-banner>
  }
  <sd-copy-field [value]="data.shareUrl" />
  <p class="sd-text-xs sd-text-soft">Read-only · expires in 7 days</p>
  <sd-button slot="actions" variant="quiet" type="button" [disabled]="stopping()" (click)="stop()"
    >Stop sharing</sd-button
  >
  <sd-button slot="actions" variant="primary" type="button" (click)="done()">Done</sd-button>
</sd-dialog>
