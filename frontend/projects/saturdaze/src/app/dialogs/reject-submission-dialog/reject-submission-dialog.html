<sd-dialog title="Reject this suggestion?" subtitle="The reason is shown to the person who sent it.">
  <form class="form" (submit)="reject($event)">
    <sd-text-input
      label="Reason"
      name="reason"
      multiline
      [rows]="3"
      hint="Optional."
      placeholder="Already listed as the Lavender Festival weekend."
      [ngModel]="reason()"
      (ngModelChange)="reason.set($event)"
    />
  </form>
  <sd-button slot="actions" variant="quiet" type="button" (click)="cancel()">Cancel</sd-button>
  <sd-button slot="actions" variant="danger" type="button" (click)="reject()">
    <sd-icon name="close" />
    Reject
  </sd-button>
</sd-dialog>
