<sd-dialog title="Add to your calendar" subtitle="One file with both days.">
  @if (error()) {
    <sd-banner tone="warn" role="alert" icon="alert">{{ error() }}</sd-banner>
  }
  @if (googleSynced) {
    <sd-banner tone="success" icon="check"
      >Your Google Calendar already has this weekend and keeps up with changes.</sd-banner
    >
  }
  <sd-list card>
    <sd-list-item [title]="calendar.fileName" [subtitle]="summary">
      <sd-disc slot="leading" icon="calendar" tone="primary" />
    </sd-list-item>
  </sd-list>
  <sd-button slot="actions" variant="quiet" type="button" (click)="cancel()">Cancel</sd-button>
  <sd-button
    slot="actions"
    variant="primary"
    type="button"
    [disabled]="busy()"
    (click)="download()"
  >
    <sd-icon name="calendar" />
    Download .ics
  </sd-button>
</sd-dialog>
