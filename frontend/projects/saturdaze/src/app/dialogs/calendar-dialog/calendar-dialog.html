<sd-dialog title="Add to your calendar" subtitle="One file with both days.">
  <sd-list card>
    <sd-list-item [title]="calendar.fileName" [subtitle]="summary">
      <sd-disc slot="leading" icon="calendar" tone="primary" />
    </sd-list-item>
  </sd-list>
  <sd-button slot="actions" variant="quiet" type="button" (click)="cancel()">Cancel</sd-button>
  <sd-button slot="actions" variant="primary" [href]="calendar.icsUrl" target="_blank" (click)="downloaded()">
    <sd-icon name="calendar" />
    Download .ics
  </sd-button>
</sd-dialog>
