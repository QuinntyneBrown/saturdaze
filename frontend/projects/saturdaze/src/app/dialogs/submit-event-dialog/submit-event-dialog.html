<sd-dialog title="Suggest an event" subtitle="Title and time are all we need. The rest helps families decide." wide>
  <form class="form" (submit)="submit($event)">
    <sd-text-input
      label="Title"
      name="title"
      required
      autocomplete="off"
      placeholder="Port Credit Buskerfest"
      [ngModel]="title()"
      (ngModelChange)="title.set($event)"
    />
    <sd-text-input
      label="Starts"
      name="startsAtLocal"
      type="datetime-local"
      required
      hint="Set to the next hour."
      [error]="dateError()"
      [ngModel]="startsAtLocal()"
      (ngModelChange)="startsAtLocal.set($event)"
    />
    <sd-text-input
      label="Ends"
      name="endsAtLocal"
      type="datetime-local"
      [ngModel]="endsAtLocal()"
      (ngModelChange)="endsAtLocal.set($event)"
    />
    <sd-text-input
      label="Location"
      name="location"
      placeholder="Memorial Park, Lakeshore Rd"
      [ngModel]="location()"
      (ngModelChange)="location.set($event)"
    />
    <sd-text-input
      label="Description"
      name="description"
      multiline
      [rows]="3"
      placeholder="What is it, and who is it good for?"
      [ngModel]="description()"
      (ngModelChange)="description.set($event)"
    />
    <div class="row-2">
      <sd-text-input label="Cost" name="costNote" placeholder="Free" [ngModel]="costNote()" (ngModelChange)="costNote.set($event)" />
      <sd-text-input label="Ages" name="ageRange" placeholder="All ages" [ngModel]="ageRange()" (ngModelChange)="ageRange.set($event)" />
    </div>
    <sd-text-input
      label="Link"
      name="sourceUrl"
      type="url"
      placeholder="https://"
      [error]="error()"
      [ngModel]="sourceUrl()"
      (ngModelChange)="sourceUrl.set($event)"
    />
    <button type="submit" hidden></button>
  </form>

  <sd-button slot="actions" variant="quiet" type="button" (click)="cancel()">Cancel</sd-button>
  <sd-button slot="actions" variant="primary" type="button" [disabled]="!canSubmit()" (click)="submit()">
    Submit
  </sd-button>
</sd-dialog>
