<sd-dialog title="Home location" subtitle="Weather and drive times start here.">
  <form class="form" (submit)="save($event)">
    <sd-text-input
      label="Neighbourhood or address"
      name="location"
      required
      [ngModel]="location()"
      (ngModelChange)="location.set($event)"
    />
    <button type="submit" hidden></button>
  </form>
  <sd-button slot="actions" variant="quiet" type="button" (click)="cancel()">Cancel</sd-button>
  <sd-button slot="actions" variant="primary" type="button" [disabled]="!canSave()" (click)="save()">Save</sd-button>
</sd-dialog>
