<sd-dialog
  title="How far will you drive?"
  subtitle="Each way. Nothing further is planned, listed or suggested."
>
  <div class="form">
    @if (error()) {
      <sd-banner tone="warn" role="alert" icon="alert">{{ error() }}</sd-banner>
    }
    <sd-select
      label="Max drive"
      name="maxDrive"
      [options]="options"
      [ngModel]="minutes()"
      (ngModelChange)="minutes.set($event)"
    />
  </div>
  <sd-button slot="actions" variant="quiet" type="button" (click)="cancel()">Cancel</sd-button>
  <sd-button slot="actions" variant="primary" type="button" [disabled]="saving()" (click)="save()"
    >Save</sd-button
  >
</sd-dialog>
