<sd-dialog [title]="title" subtitle="Ages shape the picks." wide>
  <form class="form" (submit)="submit($event)">
    <sd-text-input
      label="Name"
      name="memberName"
      required
      autocomplete="off"
      placeholder="First name"
      [error]="error() && !name().trim() ? error() : ''"
      [ngModel]="name()"
      (ngModelChange)="name.set($event); error.set('')"
    />
    <sd-text-input
      label="Age"
      name="memberAge"
      type="number"
      [min]="0"
      [max]="120"
      placeholder="7"
      [hint]="ageHint()"
      [error]="error() && name().trim() ? error() : ''"
      [ngModel]="age()"
      (ngModelChange)="age.set($event); error.set('')"
    />
    @if (isEdit) {
      @if (accessHint) {
        <p class="sd-text-xs sd-text-soft">{{ accessHint }}</p>
      }
    } @else {
      <div class="sign-in">
        <sd-seg-radio
          label="Will they sign in?"
          name="memberSignIn"
          [options]="signInOptions"
          [ngModel]="signIn()"
          (ngModelChange)="signIn.set($event); error.set('')"
        />
        <p class="sd-text-xs sd-text-soft">{{ signInHint() }}</p>
      </div>
      @if (inviting()) {
        <sd-text-input
          label="Email"
          name="memberEmail"
          type="email"
          required
          autocomplete="off"
          placeholder="name@example.com"
          [error]="emailError()"
          [ngModel]="email()"
          (ngModelChange)="email.set($event); emailError.set('')"
        />
      }
    }
    <button type="submit" hidden></button>
  </form>

  @if (isEdit) {
    <sd-button slot="actions-left" variant="quiet" warnText type="button" (click)="remove()">
      <sd-icon name="trash" />
      Remove
    </sd-button>
  }
  <sd-button slot="actions" variant="quiet" type="button" (click)="cancel()">Cancel</sd-button>
  <sd-button
    slot="actions"
    variant="primary"
    type="button"
    [disabled]="!canSubmit()"
    (click)="submit()"
  >
    @if (inviting()) {
      <sd-icon name="mail" />
    }
    {{ submitLabel() }}
  </sd-button>
</sd-dialog>
