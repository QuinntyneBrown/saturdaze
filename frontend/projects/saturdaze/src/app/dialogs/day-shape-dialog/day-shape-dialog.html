<sd-dialog title="Day shape" subtitle="When the day starts and ends, and how much goes in it." wide>
  <div class="form">
    @if (error()) {
      <sd-banner tone="warn" role="alert" icon="alert">{{ error() }}</sd-banner>
    }
    <div class="row-2">
      <sd-select
        label="Day starts"
        name="dayStart"
        [options]="dayStarts"
        [ngModel]="dayStart()"
        (ngModelChange)="dayStart.set($event)"
      />
      <sd-select
        label="Youngest's bedtime"
        name="bedtime"
        hint="The day ends half an hour before."
        [options]="bedtimes"
        [ngModel]="bedtime()"
        (ngModelChange)="bedtime.set($event)"
      />
    </div>
    <sd-seg-radio
      label="Outings a day"
      name="outings"
      [options]="pace"
      [ngModel]="outings()"
      (ngModelChange)="outings.set($event)"
    />
    <sd-seg-radio
      label="Indoor or outdoor"
      name="leaning"
      [options]="leanings"
      [ngModel]="leaning()"
      (ngModelChange)="leaning.set($event)"
    />
    <sd-list card>
      <sd-list-item title="Sunday dinner at home" subtitle="No restaurant on Sunday evening">
        <sd-toggle
          slot="trailing"
          srLabel="Sunday dinner at home"
          [ngModel]="sundayDinnerAtHome()"
          (ngModelChange)="sundayDinnerAtHome.set($event)"
        />
      </sd-list-item>
    </sd-list>
  </div>
  <sd-button slot="actions" variant="quiet" type="button" (click)="cancel()">Cancel</sd-button>
  <sd-button slot="actions" variant="primary" type="button" [disabled]="saving()" (click)="save()"
    >Save</sd-button
  >
</sd-dialog>
