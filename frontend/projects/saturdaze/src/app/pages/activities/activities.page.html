<sd-top-bar title="Discover" back>
  <sd-icon-button
    slot="trailing"
    icon="sparkle"
    label="Try something new"
    variant="filled"
    (click)="trySomethingNew()"
  />
</sd-top-bar>

<div class="activities-lede">
  <h2>{{ heading() }}</h2>
  <p>{{ lede() }}</p>
</div>

<sd-tag-group role="group" aria-label="Filter activities">
  @for (f of view().filters; track f.label) {
    <sd-chip
      [tone]="f.tone"
      role="button"
      tabindex="0"
      [attr.aria-pressed]="f.label === activeFilter()"
      (click)="selectFilter(f.label)"
      (keydown.enter)="selectFilter(f.label)"
      (keydown.space)="selectFilter(f.label); $event.preventDefault()"
    >{{ f.label }}</sd-chip>
  }
</sd-tag-group>

@for (s of view().sections; track s.title) {
  <sd-section [title]="s.title" [subtitle]="s.subtitle ?? ''">
    <div class="sd-card-grid">
      @for (a of s.activities; track a.title) {
        <sd-activity-card
          [title]="a.title"
          [subtitle]="a.subtitle ?? ''"
          [icon]="a.icon"
          [tone]="a.tone"
          [drive]="a.drive ?? ''"
          [ages]="a.ages ?? ''"
          [tag]="a.tag ?? ''"
          [why]="a.why ?? ''"
        />
      }
      @if (s.activities.length === 0) {
        <p class="activities-empty">Nothing here for this filter.</p>
      }
    </div>
  </sd-section>
}

<sd-bottom-nav active="activities" />
