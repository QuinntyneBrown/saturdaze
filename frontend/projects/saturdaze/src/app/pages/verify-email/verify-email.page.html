<sd-auth-shell>
  @switch (state()) {
    @case ('sent') {
      <sd-auth-card title="Check your email" [subtitle]="sentSubtitle()" center>
        <sd-disc slot="disc" icon="mail" tone="primary" size="xl" />
        <sd-button variant="quiet" size="lg" full type="button" [disabled]="busy() || resent()" (click)="resend()">
          <sd-icon name="refresh" />
          {{ resent() ? 'Sent' : 'Resend' }}
        </sd-button>
        <sd-button variant="ghost" size="lg" full href="/weekend">Skip to this weekend</sd-button>
      </sd-auth-card>
    }
    @case ('verifying') {
      <sd-auth-card title="Verifying your email" subtitle="One moment." center>
        <sd-spinner slot="disc" icon="mail" />
        <span class="sd-visually-hidden" role="status" aria-live="polite">Verifying your email</span>
      </sd-auth-card>
    }
    @case ('verified') {
      <sd-auth-card title="You are verified" subtitle="Tell us about your family and the first weekend follows." center>
        <sd-disc slot="disc" icon="check" tone="accent" size="xl" />
        <sd-button variant="primary" size="lg" full href="/family">
          <sd-icon name="user" />
          Set up your family
        </sd-button>
        <sd-button variant="quiet" size="lg" full href="/weekend">Skip to this weekend</sd-button>
      </sd-auth-card>
    }
    @case ('expired') {
      <sd-auth-card title="This link has expired" subtitle="Verification links last 24 hours." center>
        <sd-disc slot="disc" icon="key" tone="warn" size="xl" />
        <sd-button variant="primary" size="lg" full type="button" [disabled]="busy() || resent() || !email()" (click)="resend()">
          <sd-icon name="mail" />
          {{ resent() ? 'Sent' : 'Resend verification email' }}
        </sd-button>
        <sd-button variant="quiet" size="lg" full href="/sign-in">Back to sign in</sd-button>
      </sd-auth-card>
    }
  }
</sd-auth-shell>
