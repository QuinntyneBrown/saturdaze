<sd-dialog
  [title]="duplicating ? 'Duplicate template' : 'New email template'"
  [subtitle]="
    duplicating
      ? 'A new draft with ' + data.source!.name + '\'s content. The category stays the same.'
      : 'It starts as a draft with starter content for its category.'
  "
>
  <form class="form" [formGroup]="form" (ngSubmit)="save()">
    <sd-text-input label="Name" name="name" formControlName="name" required />
    <sd-text-input
      label="Key"
      name="key"
      formControlName="key"
      hint="Senders find the template by this key. Lowercase words joined by dots or hyphens; it cannot change later."
      [error]="keyError()"
      required
    />
    <sd-select
      label="Category"
      name="category"
      [options]="categories"
      formControlName="category"
      hint="Marketing templates always carry an unsubscribe link."
    />
    <sd-text-input
      label="Description"
      name="description"
      formControlName="description"
      placeholder="When Saturdaze sends it, and to whom."
      multiline
      [rows]="2"
    />
    @if (error()) {
      <sd-banner tone="warn" role="alert" icon="close">{{ error() }}</sd-banner>
    }
    <button type="submit" hidden></button>
  </form>
  <sd-button slot="actions" variant="quiet" type="button" (click)="cancel()">Cancel</sd-button>
  <sd-button
    slot="actions"
    variant="primary"
    type="button"
    [disabled]="!canSave()"
    (click)="save()"
  >
    <sd-icon name="plus" />
    Create template
  </sd-button>
</sd-dialog>
