<sd-dialog
  wide
  title="Add a photo from a URL"
  subtitle="HTTPS on an allowed origin only. The image is fetched once to check its type and size."
>
  @if (error()) {
    <sd-banner tone="warn" role="alert" icon="close">{{ error() }}</sd-banner>
  }
  <form class="form" [formGroup]="form" (ngSubmit)="save()">
    <sd-text-input
      label="Image URL"
      type="url"
      name="url"
      formControlName="url"
      placeholder="https://images.example.com/place.jpg"
      [error]="urlError()"
      required
    />
    <sd-text-input
      label="Alt text"
      name="alt"
      formControlName="alt"
      hint="What a person who cannot see the photo should know."
    />
    <sd-text-input label="Attribution" name="attribution" formControlName="attribution" required />
    <sd-select label="Licence" name="licence" [options]="licences" formControlName="licence" />
    @if (isOther()) {
      <sd-text-input
        label="Licence text"
        name="licenceText"
        formControlName="licenceText"
        placeholder="Who allows this photo, and under what terms"
        required
      />
    }
    <button type="submit" hidden></button>
  </form>
  <sd-button slot="actions" variant="quiet" type="button" (click)="cancel()">Cancel</sd-button>
  <sd-button
    slot="actions"
    variant="primary"
    type="button"
    [disabled]="!canSave()"
    (click)="save()"
  >
    <sd-icon name="check" />
    Save photo
  </sd-button>
</sd-dialog>
