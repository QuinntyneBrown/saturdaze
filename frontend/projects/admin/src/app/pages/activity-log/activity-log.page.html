<sd-page-header
  title="Activity log"
  subtitle="Every photo change: who, when, the place, and what changed."
/>

<sd-toolbar layout="fields">
  <sd-select
    class="toolbar__sort"
    label="Place"
    name="place"
    [options]="placeOptions()"
    [formControl]="place"
  />
  <sd-select
    class="toolbar__sort"
    label="Administrator"
    name="admin"
    [options]="adminOptions()"
    [formControl]="admin"
  />
</sd-toolbar>

@if (error()) {
  <sd-banner class="error" tone="warn" role="alert" icon="close">{{ error() }}</sd-banner>
}

@switch (status()) {
  @case ('loading') {
    <sd-status-row icon="clock">Fetching the log.</sd-status-row>
  }
  @case ('ready') {
    @if (view().rows.length) {
      <sd-list card class="audit-list">
        @for (row of view().rows; track row.id) {
          <div class="audit-row" role="listitem">
            <time class="audit-row__time" [attr.datetime]="row.datetime">{{ row.time }}</time>
            <span class="audit-row__who">{{ row.who }}</span>
            <a class="audit-row__place" [href]="row.placeHref">{{ row.placeName }}</a>
            <sd-chip [tone]="chipTone(row.action.tone)">{{ row.action.label }}</sd-chip>
            <span class="audit-row__change">{{ row.change }}</span>
          </div>
        }
      </sd-list>
      <sd-pager
        [page]="view().page"
        [pageSize]="view().pageSize"
        [total]="view().total"
        emptyText="No changes"
        (pageChange)="goToPage($event)"
      />
    } @else {
      <sd-empty
        icon="clock"
        title="No changes yet"
        body="Photo changes made in Saturdaze Admin show up here."
      />
    }
  }
}
