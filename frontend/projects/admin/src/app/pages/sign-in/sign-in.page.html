<sd-auth-shell>
  <sd-auth-card
    title="Sign in to Saturdaze Admin"
    subtitle="Same account as the family app. Only administrators get past this screen."
  >
    @if (errorMessage()) {
      <sd-banner tone="warn" role="alert" icon="alert">{{ errorMessage() }}</sd-banner>
    }
    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <sd-text-input
        label="Email"
        type="email"
        name="email"
        autocomplete="email"
        formControlName="email"
        [invalid]="fieldsInvalid() || (form.controls.email.invalid && form.controls.email.touched)"
      />
      <sd-text-input
        label="Password"
        type="password"
        name="password"
        autocomplete="current-password"
        formControlName="password"
        [invalid]="
          fieldsInvalid() || (form.controls.password.invalid && form.controls.password.touched)
        "
      />
      <div class="row">
        <sd-toggle label="Remember me" formControlName="remember" />
      </div>
      <sd-button variant="primary" size="lg" full type="submit" [disabled]="submitting()"
        >Sign in</sd-button
      >
    </form>
    @if (showGoogle()) {
      <div class="auth-card__or" role="separator" aria-label="or"><span>or</span></div>
    }
    @if (showGoogle()) {
      <div class="google-btn" #googleHost></div>
    }
  </sd-auth-card>
</sd-auth-shell>
