@for (rule of rules(); track rule.label) {
  <span class="rules__item" role="listitem" [class.rules__item--met]="rule.met">
    <span class="rules__mark" aria-hidden="true"
      ><sd-icon name="check" [size]="12" [stroke]="2.4"
    /></span>
    {{ rule.label }}<span class="sd-visually-hidden">: {{ rule.met ? 'met' : 'not yet met' }}</span>
  </span>
}
