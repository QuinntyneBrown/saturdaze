<div class="card__head">
  <sd-date-tile [date]="date()" [mon]="mon()" [day]="day()" />
  <div class="card__head-text">
    <h3 class="card__title">{{ cardTitle() }}</h3>
    @if (meta()) {
      <p class="card__meta">{{ meta() }}</p>
    }
  </div>
</div>
<div class="card__chips"><ng-content select="[slot=chips]" /></div>
@if (url() && !muted()) {
  <div class="card__footer">
    <sd-button variant="quiet" size="sm" [href]="url()" target="_blank">
      Details
      <sd-icon name="arrow_right" slot="trailing" />
    </sd-button>
  </div>
}
