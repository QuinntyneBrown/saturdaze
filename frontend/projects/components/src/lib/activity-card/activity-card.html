<div class="card__head">
  <sd-disc [icon]="icon()" [tone]="tone()" size="lg" />
  <div class="card__head-text">
    <h3 class="card__title">{{ cardTitle() }}</h3>
    @if (meta()) {
      <p class="card__meta">{{ meta() }}</p>
    }
  </div>
</div>
@if (why()) {
  <p class="card__body">{{ why() }}</p>
}
<div class="card__chips"><ng-content select="[slot=chips]" /></div>
@if (mapUrl()) {
  <div class="card__footer">
    <sd-button variant="quiet" size="sm" [href]="mapUrl()" target="_blank">
      <sd-icon name="map" />
      Map
    </sd-button>
  </div>
}
