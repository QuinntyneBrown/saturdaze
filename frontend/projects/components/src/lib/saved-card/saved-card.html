<div class="card">
  <div class="head">
    <div>
      <div class="date">{{ date() }}</div>
      <div class="title">{{ cardTitle() }}</div>
      <div class="stars" [attr.aria-label]="rating() ? rating() + ' of 5 stars' : 'Not rated yet'">
        @for (filled of stars(); track $index) {
          <sd-icon
            name="star"
            [size]="14"
            [class.filled]="filled"
          />
        }
      </div>
    </div>
    <button
      type="button"
      class="heart"
      [class.is-fav]="favourite()"
      [attr.aria-pressed]="favourite()"
      [attr.aria-label]="favourite() ? 'Remove from favourites' : 'Add to favourites'"
      (click)="toggleFavourite()"
    >
      <sd-icon name="heart" [size]="20" />
    </button>
  </div>
  @if (highlights()) {
    <div class="highlights">{{ highlights() }}</div>
  }
  <div class="footer"><ng-content /></div>
</div>
