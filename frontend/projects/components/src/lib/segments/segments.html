@if (mode() === 'tabs') {
  @for (tab of tabs(); track tab.label; let i = $index) {
    <button
      class="segments__tab"
      type="button"
      role="tab"
      [id]="tabId(tab)"
      [attr.aria-selected]="selected() === tab.label"
      [attr.aria-controls]="tab.panel ?? null"
      [attr.tabindex]="selected() === tab.label ? 0 : -1"
      (click)="selected.set(tab.label)"
      (keydown)="onKeydown($event, i)"
    >
      {{ tab.label }}
    </button>
  }
} @else {
  @for (tab of tabs(); track tab.label) {
    @if (active() !== null) {
      <a
        class="segments__tab"
        [routerLink]="linkOf(tab)"
        [fragment]="tab.fragment"
        [attr.aria-current]="active() === tab.label ? 'page' : null"
        >{{ tab.label }}</a
      >
    } @else {
      <a
        class="segments__tab"
        [routerLink]="linkOf(tab)"
        [fragment]="tab.fragment"
        routerLinkActive
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: !!tab.exact }"
        >{{ tab.label }}</a
      >
    }
  }
}
