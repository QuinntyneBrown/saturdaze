@if (label()) {
  <label class="field__label" [attr.for]="id">{{ label() }}</label>
}
<div class="chip-input">
  @for (value of values(); track value; let i = $index) {
    <sd-chip [tone]="tone()" removable [removeLabel]="'Remove ' + value" (remove)="removeAt(i)">{{
      value
    }}</sd-chip>
  }
  <input
    class="chip-input__field"
    [id]="id"
    type="text"
    [value]="draft()"
    [attr.placeholder]="placeholder()"
    [attr.aria-invalid]="statusTone() === 'error' && status() ? 'true' : null"
    [attr.aria-describedby]="status() ? statusId : null"
    [disabled]="disabled()"
    (input)="onDraft($event)"
    (keydown)="onKey($event)"
    (blur)="commit()"
  />
</div>
@if (status()) {
  <p
    class="chip-input__status"
    [class.chip-input__status--error]="statusTone() === 'error'"
    [class.field__error]="statusTone() === 'error'"
    [id]="statusId"
    role="status"
    aria-live="polite"
  >
    @if (statusTone() === 'error') {
      <sd-icon name="alert" [size]="12" [stroke]="2" />
    }
    {{ status() }}
  </p>
}
