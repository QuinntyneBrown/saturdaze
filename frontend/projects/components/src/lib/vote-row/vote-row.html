@for (cell of votes(); track cell.name; let i = $index) {
  <div class="vote-row__cell">
    <sd-avatar [name]="cell.name" [tone]="cell.tone" size="md" />
    <span class="vote-row__name">{{ cell.name }}</span>
    <div class="vote-row__choice">
      <button
        class="vote-row__btn vote-row__btn--up"
        type="button"
        [attr.aria-pressed]="cell.vote === 'up'"
        [attr.aria-label]="cell.name + ' votes yes'"
        [disabled]="disabled()"
        (click)="cast(i, 'up')"
      >
        <sd-icon name="thumbs_up" [size]="14" />
      </button>
      <button
        class="vote-row__btn vote-row__btn--down"
        type="button"
        [attr.aria-pressed]="cell.vote === 'down'"
        [attr.aria-label]="cell.name + ' votes no'"
        [disabled]="disabled()"
        (click)="cast(i, 'down')"
      >
        <sd-icon name="thumbs_down" [size]="14" />
      </button>
    </div>
  </div>
}
