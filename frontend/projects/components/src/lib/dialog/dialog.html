<div class="dialog__panel">
  <div class="dialog__header">
    <div class="dialog__heading">
      <h2 class="dialog__title" [id]="titleId">{{ dialogTitle() }}</h2>
      @if (subtitle()) {
        <p class="dialog__sub">{{ subtitle() }}</p>
      }
    </div>
    <sd-button class="dialog__close" variant="ghost" size="sm" icon [label]="closeLabel()" (click)="close()">
      <sd-icon name="close" />
    </sd-button>
  </div>
  <div class="dialog__body"><ng-content /></div>
  <div class="dialog__actions">
    <div class="dialog__actions-left"><ng-content select="[slot=actions-left]" /></div>
    <ng-content select="[slot=actions]" />
  </div>
</div>
