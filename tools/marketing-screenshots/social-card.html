<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Saturdaze social card</title>
    <!-- Rendered to marketing/assets/social-card.png (1200x630) by capture.mjs. -->
    <link rel="stylesheet" href="../../marketing/assets/tokens.css" />
    <link rel="stylesheet" href="social-card.css" />
  </head>
  <body>
    <main class="card">
      <div class="card__copy">
        <p class="card__brand"><span class="brand-mark"></span>Saturdaze</p>
        <h1>Two days.<br />Already planned.</h1>
        <p class="card__lede">
          Your family's weekend, drafted around swim lessons, church and the
          weather.
        </p>
        <p class="card__url">www.saturdaze.ca</p>
      </div>
      <div class="card__shot">
        <img src="../../marketing/assets/screenshots/weekend.png" alt="" />
      </div>
    </main>
  </body>
</html>
