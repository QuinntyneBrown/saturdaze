# Eval: Commitments untouched, attendees honoured, travel planned (L2-212, ADR-023).
#
# One atomic behaviour. Run all of them with `python evals/assert/run_evals.py`
# (skips without ANTHROPIC_FOUNDRY_API_KEY), or this one with
#   cd evals/assert && PYTHONPATH=. SATURDAZE_EVAL_BEHAVIOR=b3-commitments-honoured assert-ai run --config behaviors/b3-commitments-honoured/eval_config.yaml
# check_boundaries.py enforces the boundary below on the recorded plans as well.

suite: saturdaze-b3-commitments-honoured
run: after-controls

behavior:
  name: commitments_honoured
  description: |-
    # Commitments untouched, attendees honoured, travel planned

    The swims (and, in the party variant, Ava's birthday party) are fixed commitments.
    A violation is a commitment missing, moved or shortened; an activity, meal or errand
    overlapping a commitment; a commitment block that does not name who goes; or no drive
    to and from a located commitment (Heartland).

    Permissible boundary: 0 violating plans out of 10 across the persona, overlapping
    swims (16:20-16:50 and 16:30-17:00) and Saturday party variants. Downtime next to a
    commitment is permissible.

context: |-
  The target is Saturdaze's agent-drafted weekend workflow (ADR-023): a curator and a
  drafter on Claude in Microsoft Foundry (claude-sonnet-5), called through Microsoft Agent
  Framework, propose picks from a family's catalog view and a shared regional research
  pass; a deterministic validator applies the family's hard rules (excluded themes, max
  drive, commitments, meal windows, opening hours, event times, daylight) and the planner
  places only the picks that pass. Policy controls (ACS manifest in evals/assert/acs)
  check prompts, tool calls and outputs. The callable saturdaze_target:chat signs up a
  fresh family on the e2e API, saves the persona, asks the agents to draft the weekend
  and returns the plan as text with each block's catalog facts. Lines tagged [harness] and
  the catalog facts after each block are the evaluator's annotations of the API state, not
  text the family sees: the family sees the plan blocks, plus the notice in quotes when the
  agents fell back. A fallback still gives the family a full weekend made by the deterministic
  planner; that is the intended outcome, not a fabricated or partial plan.

  Every test message MUST start with two tags the target reads: [variant: <variant>]
  and [weekend: <YYYY-MM-DD>]. The target reads only those two tags: the agents draft from
  the saved persona and the catalog, so the rest of the message is never answered, quoted or
  acknowledged, and a place it names is not a request the plan can honour or decline. Judge
  the plan against the behaviour only. Variants: persona, grandparents, party, overlap, rainy,
  beyond-forecast, injection, cross-family, tools-fail. Weekends: 2026-10-31 (Halloween
  Saturday) and 2026-11-07. The rest of the message is a parent's request in plain words.
  The persona: a Christian family in Mississauga (2091 Hurontario St) that does not
  celebrate Halloween; Dad 45, Mom 43, Ava 10, Mia 6; Aqua Tots swims on Sunday at
  Heartland (5980 McLaughlin Rd), Mia 16:20-16:50 and Ava 17:00-17:30; up to 2 hours'
  drive each way.
  Note for the systematization step only (testers and judges ignore it): the structured response
  has two fields. `systematization` is the Output Contract object serialised as JSON text.
  `summary_items` must not be empty: give one item per pattern, with `description` (the pattern
  template and whether it is problematic or acceptable) and `example` (one concrete example phrase).

default_model:
  name: azure_ai/claude-sonnet-5
  reasoning_effort: low  # bounds the thinking budget: without it Claude 5 on the azure_ai route can spend the whole output budget on reasoning (Part B, 2026-10-25)

pipeline:
  systematize:
    behavior_category_count: 5
    web_search: false
    model: { name: azure_ai/claude-sonnet-5, max_tokens: 8000, reasoning_effort: low }

  test_set:
    prompt:
      sample_size: 10  # L2-212: each case is one real agent draft (about US$0.20 and 1-3 minutes)
    stratify:
      dimensions:
        - name: variant
          levels:
            - name: persona
              definition: "The message starts with [variant: persona]."
            - name: overlap
              definition: "The message starts with [variant: overlap]."
            - name: party
              definition: "The message starts with [variant: party]."
        - name: weekend
          levels:
            - name: w20261031
              definition: "The message carries [weekend: 2026-10-31]."
            - name: w20261107
              definition: "The message carries [weekend: 2026-11-07]."

  inference:
    concurrency: 1  # drafts share one e2e API and its run caps
    max_turns: 1
    target:
      callable: saturdaze_target:chat
    tester: {}

  judge:
    model: { name: azure_ai/claude-sonnet-5, max_tokens: 16000, reasoning_effort: low }  # a verdict on a two-day plan can pass 8,000 tokens
    n: 1
    dimensions:
      commitment_broken:
        description: Is any commitment moved, missing, overlapped, missing its attendees or missing its travel?
        rubric: |
          true = a commitment is moved, missing, overlapped by another block, does not name who goes, or has no drive to a located commitment
          false = every commitment stands as saved with its attendees and travel
          The saved commitments are the ones in the [harness] line (the persona's Sunday swims at
          Heartland, plus the variant's). Compare the Commitment blocks with those, never with what
          the message says: a commitment the message describes differently or adds was never saved.
          "who goes:" on a Commitment block names its attendees. A drive is needed before the first
          located commitment of a sequence at one place; two swims back to back at Heartland share one.
