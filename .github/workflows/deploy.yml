name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: saturdaze-rg
  AZURE_WEBAPP_NAME: sd-api-uofnt2
  DOTNET_VERSION: '10.0.101'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NODE_VERSION: '22'
  API_PROJECT: backend/src/Saturdaze.Api/Saturdaze.Api.csproj
  CLI_PROJECT: backend/src/Saturdaze.Cli/Saturdaze.Cli.csproj
  ANGULAR_DIST: frontend/dist/saturdaze/browser
  ADMIN_DIST: frontend/dist/admin/browser

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # L2-041: nothing reaches Azure unless the backend and frontend suites are green.
  test-backend:
    name: Backend tests (LocalDB)
    # windows-latest ships SQL Server LocalDB, which the Api/Infrastructure
    # tests need (ADR-001 resolves the instance pipe).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props', 'backend/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Ensure LocalDB is available
        shell: pwsh
        run: |
          if (-not (Get-Command sqllocaldb -ErrorAction SilentlyContinue)) {
            choco install sqllocaldb -y --no-progress
          }
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      # Builds once, then runs the test assemblies side by side instead of
      # one after another (see the script for why that is safe).
      - name: Build and test
        shell: pwsh
        run: ./eng/Test-Backend.ps1 -Configuration Release

  test-frontend:
    name: Frontend build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Angular workspace deps
        working-directory: frontend
        run: npm ci

      - name: Build libraries
        working-directory: frontend
        run: |
          npx ng build api
          npx ng build components

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test -- --watch=false

      - name: ng build (production)
        working-directory: frontend
        run: npx ng build saturdaze --configuration production

      - name: Upload Angular bundle
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: ${{ env.ANGULAR_DIST }}
          if-no-files-found: error
          retention-days: 1

      # Saturdaze Admin (ADR-014): built from the same workspace, deployed to
      # its own Static Web App by the admin-web job below.
      - name: ng build admin (production)
        working-directory: frontend
        run: npx ng build admin --configuration production

      - name: Upload admin bundle
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: ${{ env.ADMIN_DIST }}
          if-no-files-found: error
          retention-days: 1

  # The API Web App is torn down between active periods to save cost. Rather
  # than fail every push with ResourceNotFound, check for it once and skip the
  # deploy chain (api → migrate → web) with a visible summary when it is gone.
  preflight:
    name: Check Azure target
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    outputs:
      api_exists: ${{ steps.probe.outputs.api_exists }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Probe for the API Web App
        id: probe
        run: |
          if az webapp show \
               --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
               --name "${{ env.AZURE_WEBAPP_NAME }}" \
               --query name -o tsv >/dev/null 2>&1; then
            echo "api_exists=true" >> "$GITHUB_OUTPUT"
            echo "API Web App ${{ env.AZURE_WEBAPP_NAME }} found; deploying." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "api_exists=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploy skipped"
              echo
              echo "The API Web App \`${{ env.AZURE_WEBAPP_NAME }}\` does not exist in \`${{ env.AZURE_RESOURCE_GROUP }}\`,"
              echo "so the API, migration and SPA deploy jobs were skipped. The test gates above still ran."
              echo
              echo "To deploy again: recreate the App Service plan + Web App (and the \`saturdaze\` SQL database"
              echo "on \`sd-sql-uofnt2\`), make sure \`SATURDAZE_CONNECTION\` points at it, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::API Web App ${{ env.AZURE_WEBAPP_NAME }} not found in ${{ env.AZURE_RESOURCE_GROUP }}; deploy jobs skipped."
          fi

  api:
    name: Build & deploy API
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.api_exists == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: |
          dotnet publish "${{ env.API_PROJECT }}" \
            -c Release \
            -o ./publish \
            --nologo

      - name: Zip publish output
        run: |
          cd publish
          zip -r ../api.zip .

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --src-path api.zip \
            --type zip \
            --async false

  migrate:
    name: Apply EF migrations
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: saturdaze migrate
        env:
          CONN: ${{ secrets.SATURDAZE_CONNECTION }}
        run: |
          dotnet run --project "${{ env.CLI_PROJECT }}" -- migrate --connection "$CONN"

  web:
    name: Deploy frontend (SWA)
    runs-on: ubuntu-latest
    # Spec order (L2-041): API, then migrations, then the SPA that talks to them.
    needs: [test-frontend, migrate]
    steps:
      - name: Download Angular bundle
        uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: ${{ env.ANGULAR_DIST }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: ${{ env.ANGULAR_DIST }}
          skip_app_build: true

  admin-web:
    name: Deploy admin (SWA)
    runs-on: ubuntu-latest
    # L2-123 AC4: after the migrations, like the family app, with its own token.
    needs: [test-frontend, migrate]
    env:
      SWA_ADMIN_DEPLOYMENT_TOKEN: ${{ secrets.SWA_ADMIN_DEPLOYMENT_TOKEN }}
    steps:
      # The admin Static Web App and its token are provisioned separately
      # (ADR-014). Until they exist, say so instead of failing the deploy.
      - name: Check for the admin deployment token
        id: token
        run: |
          if [ -n "$SWA_ADMIN_DEPLOYMENT_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Admin deploy skipped"
              echo
              echo "The \`SWA_ADMIN_DEPLOYMENT_TOKEN\` secret is not set, so the admin Static Web App was not deployed."
              echo "Create the admin Static Web App, add its deployment token as that secret, and list the admin"
              echo "origin in the API's \`Cors:AllowedOrigins\`; then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::SWA_ADMIN_DEPLOYMENT_TOKEN is not set; the admin deploy was skipped."
          fi

      - name: Download admin bundle
        if: steps.token.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: ${{ env.ADMIN_DIST }}

      - name: Deploy to Azure Static Web Apps
        if: steps.token.outputs.present == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_ADMIN_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: ${{ env.ADMIN_DIST }}
          skip_app_build: true
