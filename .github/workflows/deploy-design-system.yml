name: Deploy design system
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['design-system/**', '.github/workflows/deploy-design-system.yml']

# Two rapid pushes touching design-system/ must not race the upload.
concurrency:
  group: deploy-design-system-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
        working-directory: design-system
      - run: npx playwright install --with-deps chromium
        working-directory: design-system
      - run: npm test
        working-directory: design-system
      # The test web server builds as a side effect; build explicitly so the
      # uploaded dist never depends on that coupling.
      - run: npm run build
        working-directory: design-system
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DESIGN_SYSTEM_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: design-system/dist
          skip_app_build: true
          skip_api_build: true
