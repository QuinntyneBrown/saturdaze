name: Deploy Storybook
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/projects/components/**'
      - 'frontend/angular.json'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/deploy-storybook.yml'

# Two rapid pushes touching the components library must not race the upload.
concurrency:
  group: deploy-storybook-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build-storybook
        working-directory: frontend
      # Same Static Web App (and token) the retired design-system/ catalog used.
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DESIGN_SYSTEM_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: frontend/dist/storybook
          skip_app_build: true
          skip_api_build: true
